# Temporary branch-only staging workflow. Remove before merging the PR.
name: Stage upstream beta.4.8 sync

on:
  push:
    branches:
      - chore/upstream-beta-4-8-sync
    paths:
      - .github/workflows/stage-upstream-beta-4-8.yml

permissions:
  contents: write

concurrency:
  group: upstream-beta-4-8-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: [self-hosted, linux, x64, grok-box]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/upstream-beta-4-8-sync
          fetch-depth: 0
          persist-credentials: true
      - name: Merge pinned upstream on staging branch only
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/WhiteTowerAI/ohmygame.git
          git fetch --no-tags upstream main
          test "$(git rev-parse upstream/main)" = "2cec05e4af5c83d341a02df3462088475685c772"
          test "$(git merge-base HEAD upstream/main)" != ""
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit -X ours upstream/main
          # Preserve fork-specific safety controls; reject unexpected release activation.
          grep -q '^  workflow_dispatch:' .github/workflows/release-desktop.yml
          if grep -q '^[[:space:]]*tags:' .github/workflows/release-desktop.yml; then
            echo 'Desktop release tag trigger reactivated' >&2
            exit 1
          fi
          test "$(grep -c 'if: \$\{\{ false \}\}' .github/workflows/release-desktop.yml)" -ge 2
          grep -q 'codex-app-server' src/renderer/models-settings.tsx
          git status --short
          git show --stat --oneline --summary HEAD | tail -65
          git push origin HEAD:refs/heads/chore/upstream-beta-4-8-sync
